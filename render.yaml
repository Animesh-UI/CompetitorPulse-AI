services:
  - type: web
    name: competitor-pulse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_PATH
        value: competitor_pulse.db
      - key: DATAFORSEO_LOCATION_CODE
        value: "2356"
      - key: DATAFORSEO_LANGUAGE_CODE
        value: en
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
